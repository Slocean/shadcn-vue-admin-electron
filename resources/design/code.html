<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff5724",
                        "background-light": "#f8f6f5",
                        "background-dark": "#23140f",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
<!-- Background Decoration -->
<div class="fixed inset-0 z-0 opacity-20 pointer-events-none"><div class="absolute inset-0" style="background-image: radial-gradient(#e2e8f0 1px, transparent 1px); background-size: 32px 32px; opacity: 0.5;"></div><div class="absolute top-0 right-0 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px]"></div><div class="absolute bottom-0 left-0 w-[600px] h-[600px] bg-primary/10 rounded-full blur-[120px]"></div></div>
<!-- Login Container -->
<div class="relative z-10 w-full max-w-md">
<div class="bg-white dark:bg-slate-900 shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-800 rounded-3xl" style="box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);">
<!-- Header/Logo Area -->
<div class="pt-10 pb-6 px-8 flex flex-col items-center"><div class="w-16 h-16 bg-gradient-to-br from-primary to-orange-600 rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-3xl">corporate_fare</span>
</div>
<h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">Acme Inc Enterprise</h1>
<p class="text-slate-500 dark:text-slate-400 mt-1 font-medium">Welcome back</p></div>
<!-- Form Area -->
<div class="px-8 pb-10">
<form action="#" class="space-y-5">
<!-- Username -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">person</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-200 outline-none text-slate-900 dark:text-white placeholder:text-slate-400 !bg-white dark:!bg-slate-800 border-slate-200 dark:border-slate-700" id="username" name="username" placeholder="Enter your username" type="text"/>
</div>
</div>
<!-- Password -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:underline" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl">lock</span>
<input class="w-full pl-12 pr-12 py-3.5 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-200 outline-none text-slate-900 dark:text-white placeholder:text-slate-400 !bg-white dark:!bg-slate-800 border-slate-200 dark:border-slate-700" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center px-1">
<input class="w-4 h-4 rounded border-slate-300 dark:border-slate-600 text-primary focus:ring-primary cursor-pointer" id="remember" name="remember" type="checkbox"/>
<label class="ml-2 text-sm text-slate-600 dark:text-slate-400 cursor-pointer select-none" for="remember">Remember this device</label>
</div>
<!-- Login Button -->
<button class="w-full bg-gradient-to-r from-primary to-orange-600 hover:from-orange-600 hover:to-primary text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/25 transition-all duration-300 transform active:scale-[0.98] mt-4 flex items-center justify-center gap-2" type="submit">
                        Sign In
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Footer Info -->
<div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-center"><div class="flex justify-center items-center gap-6 mt-2">
<div class="flex items-center gap-1.5 text-xs text-slate-400">
<span class="material-symbols-outlined text-sm">verified_user</span> 256-bit AES
    </div>
<div class="flex items-center gap-1.5 text-xs text-slate-400">
<span class="material-symbols-outlined text-sm">security</span> Multi-factor ready
    </div>
</div></div>
</div>
</div>
<!-- Bottom Links -->
<div class="mt-6 flex justify-between px-4"><p class="text-xs text-slate-400 font-medium">© 2024 Acme Inc.</p>
<div class="flex gap-6">
<a class="text-xs text-slate-400 hover:text-primary transition-colors" href="#">Support</a>
<a class="text-xs text-slate-400 hover:text-primary transition-colors" href="#">Privacy</a>
</div></div>
</div>
</body></html>
